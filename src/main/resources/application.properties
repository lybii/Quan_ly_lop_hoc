spring.application.name=quan_ly_lop_hoc

# Cấu hình database
spring.datasource.url=jdbc:mysql://localhost:3306/quanlylophoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true
spring.datasource.username=root
